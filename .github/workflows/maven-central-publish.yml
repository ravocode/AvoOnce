name: Publish to Maven Central

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG key
        run: |
          echo "${{ secrets.OSSRH_GPG_SECRET_KEY }}" | base64 -d | gpg --import --no-tty --batch --yes
          gpg --list-secret-keys

      - name: Publish to Maven Central
        # The release profile includes the GPG signing, Javadoc, and Source plugins
        run: mvn -B deploy -P release -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

